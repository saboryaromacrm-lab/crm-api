# DEV / ENSAYO GENERAL — dev.crm.TUDOMINIO.com
#
# Igual que producción, con tres diferencias, todas a propósito:
#   1. otra carpeta y otro puerto de API (4001)
#   2. CONTRASEÑA de entrada: dev tiene una copia de los datos reales —nombres
#      y CUIT de clientes, costos, ventas— y merece la misma protección que
#      producción. Es una línea y cierra el agujero.
#   3. `noindex`: nada de que Google publique la etapa de prueba.
#
#   sudo cp nginx-crm-dev.conf /etc/nginx/sites-available/crm-dev
#   sudo ln -s /etc/nginx/sites-available/crm-dev /etc/nginx/sites-enabled/
#
# El archivo de contraseñas lo generás vos (no queda en git):
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-dev equipo

server {
    listen 80;
    listen [::]:80;
    server_name dev.crm.TUDOMINIO.com;

    root /srv/crm/dev/crm-dashboard/dist;
    index index.html;

    access_log /var/log/nginx/crm-dev.access.log;
    error_log  /var/log/nginx/crm-dev.error.log;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ni buscadores ni archivadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Sabor y Aroma — etapa de prueba";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    location /api/ {
        # El auth_basic de arriba aplica también acá: se hereda.
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # En dev NO se cachean los assets: se despliega diez veces por día y una
    # caché de un año garantiza estar mirando algo viejo.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CUANDO ENTRE LA TIENDA (sitio-web, Next.js — hoy diferida):
# no es estática, es un proceso Node, así que su bloque es un proxy entero y no
# un `root`. Puertos reservados: 3002 producción, 4002 dev.
