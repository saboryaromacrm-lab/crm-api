# PRODUCCIÓN — crm.TUDOMINIO.com
#
#   sudo cp nginx-crm-prod.conf /etc/nginx/sites-available/crm-prod
#   sudo ln -s /etc/nginx/sites-available/crm-prod /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.TUDOMINIO.com     # agrega el 443 y el redirect
#
# Reemplazá TUDOMINIO por el dominio real. Certbot escribe el bloque 443 y el
# redirect de 80 solo: acá va la configuración de la app, no la del TLS.

server {
    listen 80;
    listen [::]:80;
    server_name crm.TUDOMINIO.com;

    # El dashboard es ESTÁTICO: nginx lo sirve directo, no hay proceso Node.
    root /srv/crm/prod/crm-dashboard/dist;
    index index.html;

    access_log /var/log/nginx/crm-prod.access.log;
    error_log  /var/log/nginx/crm-prod.error.log;

    # Los papeles de facturas viajan como base64 dentro del JSON: 2,5 MB de
    # archivo se vuelven ~3,4 MB de texto, y el body de la API admite 4 MB.
    # El default de nginx es 1 MB y cortaría la subida con un 413 sin
    # explicación. 6 MB deja aire sin volverse un agujero.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # LA API, EN EL MISMO ORIGEN.
    # El dashboard la llama como `/api` (default relativo de env.js), así que
    # publicarla acá tiene dos efectos: el bundle no lleva ninguna URL horneada
    # —el MISMO dist/ sirve para prod y para dev— y no hay CORS porque no hay
    # cruce de orígenes.
    location /api/ {
        # Sin URI después del puerto: nginx pasa el path tal cual llegó.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr y NO $proxy_add_x_forwarded_for: concatenar deja que el
        # cliente invente el primer valor de la cadena, y el rate limit de la
        # API confía en ese encabezado (`trust proxy` en main.ts).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La importación de catálogos y la lectura de PDFs tardan.
        proxy_read_timeout 120s;
    }

    # Los assets llevan hash en el nombre (index-DxoJ8qeQ.js): si el nombre
    # existe, el contenido nunca cambia. Se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index NO se cachea: es lo que apunta a los assets nuevos después de un
    # deploy. Cacheado, la caja seguiría cargando la versión anterior.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: las rutas internas (/almacen, /ventas…) las resuelve React Router,
    # no existen como archivos. Sin esto, un F5 en /almacen da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
